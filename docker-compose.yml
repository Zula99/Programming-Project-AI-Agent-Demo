# Remove version as it's obsolete in newer Docker Compose

services:
  app:
    build: .
    container_name: ai-agent-app
    env_file:
      - ./ai-agent-demo-factory-backend/.env  # Load environment variables from .env file at runtime
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    volumes:
      # Mount output directory to host for persistent storage
      - ./ai-agent-demo-factory-backend/output:/app/backend/output
      # Mount logs directory to host for persistent log storage
      - ./logs:/app/backend/logs
      # Mount source code for development (optional)
      - ./ai-agent-demo-factory-backend:/app/backend
      - ./crawl4ai:/app/crawl4ai
    ports:
      - "8000:8000"
      - "3000:3000"
    depends_on:
      - opensearch-demo
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - ai-agent-network

  opensearch-demo:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-demo
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - ai-agent-network
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://opensearch-demo:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      - opensearch-demo
    networks:
      - ai-agent-network
    restart: unless-stopped

  # Future: Add database service when learning system is implemented
  # ai-agent-db:
  #   image: postgres:15-alpine
  #   container_name: ai-agent-database
  #   environment:
  #     - POSTGRES_DB=ai_agent_patterns
  #     - POSTGRES_USER=aiagent
  #     - POSTGRES_PASSWORD=secure_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - ai-agent-network

networks:
  ai-agent-network:
    driver: bridge

volumes:
  opensearch-data:
